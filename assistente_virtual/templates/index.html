<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AI Demo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h1>🤖 J.A.R.V.I.S - MEU ASSISTENTE VIRTUAL</h1>

        <form id="question-form">
            <div class="parameters">
                <div class="param-group">
                    <label for="temperature">Temperature: <span id="temp-value" class="value-display"></span></label>
                    <input type="range" id="temperature" name="temperature" min="0" max="2" step="0.1" value="1.0">
                    <div class="param-description">Controla a criatividade das respostas. Valores baixos = mais focado,
                        valores altos = mais criativo</div>
                </div>

                <div class="param-group">
                    <label for="topK">Top K: <span id="topk-value" class="value-display"></span></label>
                    <input type="number" id="topK" name="topK" min="1" max="100" value="40">
                    <div class="param-description">Limita a seleção às K palavras mais prováveis. Valores menores = mais
                        previsível</div>
                </div>
            </div>

            <label for="question">Converse com Jarvis:</label>
            <textarea name="question" id="question" placeholder="Digite sua pergunta aqui..."></textarea>

            <button type="submit" id="ask-button">Enviar</button>
        </form>

        <div id="output"></div>

        <footer class="copyright">
            Vanderlei Sousa de Carvalho - Engenharia de Dados - <span id="year"></span>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
